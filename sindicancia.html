<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sindicância EB10-IG-09.001</title>
<style>

green);color:#fff;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}.top-home:hover{background:var(--olive)}.search{border:1px solid var(--line);border-radius:40px;background:#fff;padding:10px 15px;width:230px}.search input{border:0;outline:0;width:180px;background:transparent}.tabs{display:none}.content{max-width:1120px;margin:auto;padding:40px 44px 75px}.head{margin-bottom:28px}.head span,.label{font-size:11px;font-weight:bold;letter-spacing:.14em;color:var(--gold)}.head h2{font:42px Georgia,serif;margin:8px 0}.head p,.muted{color:#657169;line-height:1.65}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:17px;margin-bottom:17px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:23px}.purpose{border-top:4px solid #456747}.purpose h3{font:24px/1.35 Georgia,serif}.dark{background:var(--olive);color:#fff;border:0}.dark p{color:#d2ddd4}.dark strong{display:block;font:23px Georgia,serif;margin:18px 0}.card h3{font:21px Georgia,serif;margin-top:0}.authority{list-style:none;padding:0;margin:0}.authority li{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e2d9;font-size:14px}.authority i{font-style:normal;min-width:26px;height:26px;border-radius:50%;background:#e5ece3;display:grid;place-items:center;font-size:12px;font-weight:bold}.condition{padding:12px 14px;border-left:4px solid;border-radius:6px;margin:9px 0}.condition b{font-size:11px;letter-spacing:.1em}.condition p{font-size:13px;margin:5px 0}.good{background:#e5eee3;border-color:#50744e}.warn{background:#eee9db;border-color:var(--gold)}.bad{background:#f3e5e1;border-color:var(--red)}.callout{margin-top:17px;background:#f5e8e4;border:1px solid #d9aea4;border-left:5px solid var(--red);padding:18px;border-radius:10px}.callout b{font-size:12px;color:#833526}.callout p{margin:7px 0;line-height:1.55}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.person{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px}.person span{font-size:11px;color:var(--gold)}.person h4{margin:8px 0 5px}.person p{font-size:13px;color:#69746c;margin:0;line-height:1.5}.topics{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.flow{display:grid;gap:9px}.flow button{display:grid;grid-template-columns:42px 1fr auto;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px}.flow button.done{background:#e4eee3}.num{width:31px;height:31px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-size:11px}.flow b,.flow small{display:block}.flow small{color:#69756c;margin-top:4px}.flow em{font-size:11px;color:#89928b;font-style:normal}.report,.formula{background:var(--green);color:#fff;border-radius:16px;padding:23px;margin-top:20px}.report{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.report h3{font-size:29px;margin:8px 0}.report ul{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:9px;list-style:none;padding:0}.report li{background:#ffffff0d;border-radius:8px;padding:10px;font-size:12px}.report li b{display:block;color:#dfc879}.timeline{display:grid;gap:9px}.deadline{display:grid;grid-template-columns:145px 1fr auto;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}.time{background:#e4ebe3;border-radius:30px;padding:8px;text-align:center;font-weight:bold;font-size:12px}.deadline h3{font-size:15px;margin:0}.deadline p{font-size:12px;color:#68746b;margin:4px 0}.deadline>small{color:#78847b}.formula{text-align:center}.formula strong{display:block;font-size:27px;margin:10px}.rights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.right{background:var(--paper);border:1px solid var(--line);padding:14px;border-radius:10px;font-size:13px}.right span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#456747;color:#fff;margin-right:8px}.decision{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.decision div{padding:18px;border:1px solid var(--line);border-radius:12px;background:#e3ece2}.decision .no{background:#eee8dc}.alerts{display:grid;gap:11px}.alert{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--red);padding:17px;border-radius:11px}.alert:nth-child(2){border-left-color:var(--gold)}.alert:nth-child(3){border-left-color:#315f73}.alert h3{margin:0;font-size:16px}.alert p{font-size:13px;line-height:1.5;color:#647068;margin:5px 0}.final{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px}.final div{background:var(--green);color:#fff;padding:17px;border-radius:11px}.final b,.final small{display:block;color:#d8bd78;font-size:10px}.final strong{display:block;margin:10px 0;font-size:14px}footer{text-align:center;border-top:1px solid var(--line);padding:20px;color:#788179;font-size:11px}
@media(max-width:850px){.app{display:block}.side{display:none}.top{height:80px;padding:12px 16px}.top h1{font-size:20px}.kicker{display:block;font-size:9px;color:#78847b;margin-bottom:4px}.top-actions{gap:7px}.top-home{min-height:40px;padding:0 13px;font-size:12px}.search{width:42px;padding:9px}.search input{display:none}.tabs{display:flex;position:sticky;top:80px;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);gap:7px;padding:9px 13px;overflow:auto}.tabs button{min-width:37px;height:37px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--olive);font-weight:bold}.tabs button.active{background:var(--olive);color:#fff}.content{padding:26px 15px 55px}.head h2{font-size:31px}.grid2,.topics,.report{grid-template-columns:1fr}.cards,.rights{grid-template-columns:repeat(2,1fr)}.deadline{grid-template-columns:100px 1fr}.deadline>small{display:none}.final{grid-template-columns:1fr}.alert{grid-template-columns:35px 1fr}.alert>b{grid-column:2}.flow button{grid-template-columns:38px 1fr}.flow em{display:none}}@media(max-width:500px){.cards,.rights,.decision{grid-template-columns:1fr}.report ul{grid-template-columns:1fr}.deadline{grid-template-columns:90px 1fr;padding:11px 9px;gap:8px}.formula strong{font-size:20px}}
.page-actions{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;gap:8px}.page-actions a,.page-actions button{border:1px solid #ffffff35;background:#173025;color:#fff;text-decoration:none;border-radius:30px;padding:10px 14px;font:700 12px Arial,sans-serif;box-shadow:0 6px 20px #0003}.page-actions button{cursor:pointer}@media(max-width:850px){.page-actions{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}.page-actions a,.page-actions button{padding:9px 12px;font-size:11px}}</style></head><body><nav class="page-actions" aria-label="Navegação"><button type="button" onclick="history.back()">← Voltar</button><a href="index.html">⌂ Início</a></nav><div id="app"></div>
<script>
const chapters=[['competencia','01','Finalidade e competência','Quem faz o quê','◎'],['gerais','02','Disposições gerais','Regras da apuração','▦'],['rito','03','Rito ordinário','Passo a passo','→'],['prazos','04','Prazos','Linha do tempo','◷'],['defesa','05','Contraditório e defesa','Direitos do sindicado','◇'],['finais','06','Disposições finais','Alertas e recursos','!']];
let active='competencia',query='',checked=new Set();
const authorities=['Comandante do Exército','Ocupante de cargo privativo de oficial-general','Comandante, chefe ou diretor de OM','Ch EM, SCmt, SCh, SDir ou Ch Gab de ODG, ODS, ODOp, G Cmdo, GU e OADI','Substituto legal, no exercício regular da função'];
const participants=[['Autoridade nomeante','Militar competente que instaura e soluciona'],['Sindicante','Encarregado da sindicância'],['Sindicado','Pessoa cujos direitos podem ser afetados'],['Testemunha','Relata o que sabe sobre o fato'],['Técnico','Realiza exame ou emite parecer'],['Denunciante ou ofendido','Provoca a ação da administração']];
const flow=[['Abertura','Lavrar o termo de abertura.'],['Organização','Documentos em ordem cronológica; folhas numeradas e rubricadas.'],['Identificação','Capa com NUP, sindicante, sindicado e objeto.'],['Despachos','Regular e coordenar as ações.'],['Notificação','Dar ciência do fato, inquirição, defesa e provas.'],['Instrução','Colher documentos, depoimentos, perícias e provas.'],['Vista e finais','Encerrar instrução e abrir vista para alegações finais.'],['Relatório','Introdução, diligências, expositiva e conclusiva.'],['Remessa','Termo de encerramento e envio à autoridade.'],['Solução','Decisão explícita, clara, coerente e motivada.']];
const deadlines=[['30 dias corridos','Conclusão inicial','Começa no recebimento da portaria pelo sindicante.','Art. 30'],['+ 20 dias','Prorrogação','Pedido fundamentado; sucessivas apenas excepcionalmente.','Arts. 30–31'],['48 horas antes','Pedir prorrogação','Antecedência mínima do fim do prazo.','Art. 31'],['3 dias úteis','Notificação de diligência','Antecedência mínima para acompanhar a instrução.','Art. 32'],['3 dias úteis','Defesa prévia','Contados da inquirição.','Art. 33'],['5 dias corridos','Alegações finais','Após vista dos autos.','Art. 33'],['10 dias úteis','Solução','Após recebimento dos autos pela autoridade.','Art. 34'],['até 20 dias','Diligência complementar','Prazo corrido e prorrogável fundamentadamente.','Art. 34'],['5 dias úteis','Reconsideração ou recurso','Do dia imediato à ciência da decisão.','Art. 40']];
const rights=['Acompanhar o processo','Apresentar defesa prévia','Apresentar alegações finais','Arrolar testemunhas','Assistir aos depoimentos','Solicitar reinquirições','Requerer perícias','Juntar documentos','Obter cópias dos autos','Formular quesitos','Constituir advogado','Requerer medidas de defesa'];
const head=(e,t,p)=>`<header class="head"><span>${e}</span><h2>${t}</h2><p>${p}</p></header>`;
function page(){if(active==='competencia')return head('CAPÍTULO I · ARTS. 1º A 5º','Finalidade e competência','Entenda a razão de existir da sindicância e quem pode instaurá-la.')+`<div class="grid2"><div class="card purpose"><span class="label">OBJETIVO</span><h3>Apurar fatos de interesse da administração militar ou situações que envolvam direitos.</h3><p class="muted">Procedimento formal e escrito.</p></div><div class="card dark"><span class="label">INSTAURAÇÃO</span><strong>Portaria + publicação em BI</strong><p>No comando onde ocorreu o fato, salvo situação excepcional.</p></div></div><div class="grid2"><div class="card"><h3>Quem pode instaurar?</h3><ol class="authority">${authorities.map((x,i)=>`<li><i>${i+1}</i>${x}</li>`).join('')}</ol></div><div class="card"><h3>Quando instaurar?</h3><div class="condition good"><b>OBRIGATÓRIA</b><p>Quando a lei determinar ou não houver instrumento adequado.</p></div><div class="condition warn"><b>FACULTATIVA</b><p>Quando julgada necessária.</p></div><div class="condition bad"><b>DISPENSADA</b><p>Quando prova documental idônea comprovar o fato.</p></div></div></div><div class="callout"><b>PEGADINHA · Art. 2º, § 1º</b><p>Sem pessoa identificada, é investigatória. Identificado o sindicado, torna-se processual e exige contraditório e ampla defesa.</p></div>`;
if(active==='gerais')return head('CAPÍTULO II · ARTS. 6º A 23','As regras da apuração','Participantes, depoimentos, testemunhas e publicidade organizados por tema.')+`<div class="cards">${participants.map((x,i)=>`<div class="person"><span>0${i+1}</span><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}</div><div class="topics"><div class="card"><h3>Ordem das oitivas</h3><p><b>Denunciante/ofendido → testemunhas destes → testemunhas do sindicado.</b></p><p class="muted">Testemunhas individualmente; divergência permite acareação.</p></div><div class="card"><h3>Regras numéricas</h3><p><b>3</b> testemunhas por parte<br><b>8h–18h</b> horário normal<br><b>4h</b> antes de descanso de 30 min<br><b>3 dias úteis</b> para quesitos em precatória</p></div><div class="card"><h3>Sindicante</h3><p class="muted">Oficial, aspirante, subtenente ou sargento aperfeiçoado, de maior precedência que o sindicado.</p></div><div class="card"><h3>Publicidade e sigilo</h3><p class="muted">Em regra, ostensiva. O sigilo não restringe o sindicado nem seu advogado.</p></div></div>`;
if(active==='rito'){let list=flow.map((x,i)=>[x,i]).filter(x=>!query||x[0].join(' ').toLowerCase().includes(query.toLowerCase()));return head('CAPÍTULO III · ARTS. 24 A 26','Rito ordinário, passo a passo','Toque em uma etapa para marcá-la como revisada.')+`<div class="flow">${list.map(([x,i])=>`<button data-check="${i}" class="${checked.has(i)?'done':''}"><span class="num">${checked.has(i)?'✓':String(i+1).padStart(2,'0')}</span><span><b>${x[0]}</b><small>${x[1]}</small></span><em>Art. ${i<9?'24':'25'}</em></button>`).join('')}</div><div class="report"><div><span class="label">RELATÓRIO EM 4 PARTES</span><h3>I · D · E · C</h3><p>Introdução → Diligências → Expositiva → Conclusiva</p></div><ul><li><b>Introdução</b>ordem, fato e identificação</li><li><b>Diligências</b>ações realizadas</li><li><b>Expositiva</b>fatos e provas</li><li><b>Conclusiva</b>parecer e providências</li></ul></div>`}
if(active==='prazos')return head('CAPÍTULO V · ARTS. 29 A 34','Linha do tempo dos prazos','Exclua o dia inicial e inclua o vencimento; início e fim em dia de expediente.')+`<div class="timeline">${deadlines.filter(d=>!query||d.join(' ').toLowerCase().includes(query.toLowerCase())).map(d=>`<div class="deadline"><div class="time">${d[0]}</div><div><h3>${d[1]}</h3><p>${d[2]}</p></div><small>${d[3]}</small></div>`).join('')}</div><div class="formula"><span class="label">ESPINHA DORSAL</span><strong>30 + 20 · 3 · 3 · 5 · 10</strong><small>Conclusão + prorrogação · diligência · defesa · finais · solução</small></div>`;
if(active==='defesa')return head('CAPÍTULO VI · ARTS. 35 A 38','Contraditório e ampla defesa','Direitos do sindicado, dispensa e limites ao pedido de prova.')+`<div class="rights">${rights.filter(x=>!query||x.toLowerCase().includes(query.toLowerCase())).map(x=>`<div class="right"><span>✓</span><b>${x}</b></div>`).join('')}</div><div class="decision"><div><small>EXISTE SINDICADO</small><h3>Contraditório + ampla defesa</h3></div><div class="no"><small>NÃO EXISTE</small><h3>Dispensados os prazos de defesa</h3><p>Surgindo indícios contra alguém, notifique-o como sindicado.</p></div></div><div class="grid2"><div class="card"><h3>Indeferimento</h3><p class="muted">Decisão fundamentada: pedido ilícito, impertinente, desnecessário, protelatório ou sem interesse.</p></div><div class="card"><h3>Advogado</h3><p class="muted">Acompanha os atos; nas oitivas, pergunta ao final por intermédio do sindicante.</p></div></div>`;
return head('CAPÍTULO VII · ARTS. 39 A 44','Alertas, consequências e recursos','Regras que mudam o desfecho e aparecem como ressalvas de prova.')+`<div class="alerts"><div class="alert"><span>01</span><div><h3>Transgressão disciplinar</h3><p>Antes de medida disciplinar, é obrigatório apresentar FATD. O relatório serve como peça acusatória.</p></div><b>Art. 39</b></div><div class="alert"><span>02</span><div><h3>Notificação da solução</h3><p>Sindicado e denunciante ou ofendido devem ser notificados.</p></div><b>Art. 39</b></div><div class="alert"><span>03</span><div><h3>Reconsideração ou recurso</h3><p>Sem efeito suspensivo; prazo de 5 dias úteis.</p></div><b>Art. 40</b></div><div class="alert"><span>04</span><div><h3>Denúncia sem provas ou indícios</h3><p>Não instaura sindicância; admite verificação sumária, sem juntar a denúncia.</p></div><b>Art. 41</b></div></div><div class="final"><div><b>CASOS OMISSOS</b><strong>Comandante do Exército</strong><small>Art. 42</small></div><div><b>ANEXOS</b><strong>Exemplificativos e adaptáveis</strong><small>Art. 43</small></div><div><b>TRANSIÇÃO</b><strong>Portarias anteriores a 1º jan. 2025</strong><small>Art. 44</small></div></div>`}
function render(){let c=chapters.find(x=>x[0]===active);document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="crest">EB</div><div><strong>SINDICÂNCIA</strong><small>EB10-IG-09.001</small></div></div><nav class="nav">${chapters.map(x=>`<button data-id="${x[0]}" class="${x[0]===active?'active':''}"><span class="ico">${x[4]}</span><span><b>${x[1]} · ${x[2]}</b><small>${x[3]}</small></span></button>`).join('')}</nav><div class="scope"><b>ESCOPO DE ESTUDO</b><p>Somente rito ordinário</p><span>Rito sumário removido</span></div></aside><section class="work"><header class="top"><div><span class="kicker">SINDICÂNCIA · EB10-IG-09.001</span><h1>${c[1]}. ${c[2]}</h1></div><div class="top-actions"><a class="top-home" href="index.html" aria-label="Voltar à página inicial">⌂ Início</a><label class="search">⌕ <input id="search" value="${query}" placeholder="Buscar nesta página"></label></div></header><nav class="tabs">${chapters.map(x=>`<button data-id="${x[0]}" class="${x[0]===active?'active':''}">${x[1]}</button>`).join('')}</nav><article class="content">${page()}</article><footer>Material baseado na EB10-IG-09.001 · Rito sumário excluído conforme solicitado.</footer></section></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;query='';render()});let s=document.getElementById('search');s.oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let i=+b.dataset.check;checked.has(i)?checked.delete(i):checked.add(i);render()})}render();
</script></body></html>
